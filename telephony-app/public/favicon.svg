  <rect x="61" y="36" width="4.5" height="25" rx="2.25" fill="#16A34A" />
  <rect x="68.5" y="40" width="4.5" height="20" rx="2.25" fill="#16A34A" />
  <rect x="76" y="46" width="4.5" height="12" rx="2.25" fill="#16A34A" />
</svg>
